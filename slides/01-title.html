<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="manifest.js"></script>
<script src="deck.js"></script>
<title>Clout · Title</title>
<style>
  .hero { flex: 1; display: grid; grid-template-columns: 1fr 820px; align-items: center; gap: 40px; }
  .hero-title .dot { color: var(--accent); }
  .tagline { font-size: 44px; line-height: 1.25; color: var(--ink-2); margin-top: 36px; max-width: 900px; }
  .team { margin-top: 64px; width: 860px; border-top: 1.5px solid var(--line-strong); }
  .team-head { display: flex; justify-content: space-between; padding: 18px 4px 12px; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .member { display: flex; justify-content: space-between; align-items: baseline; padding: 13px 4px; border-top: 1.5px solid var(--line); font-size: 28px; }
  .member b { font-weight: 500; }
  .member span { font-family: var(--font-mono); font-size: 22px; color: var(--ink-2); letter-spacing: 0.02em; }
  .net { width: 860px; height: auto; display: block; justify-self: end; }
</style>
</head>
<body>
<section class="slide">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Clout <small data-deck="footer"></small></div>
    <div class="spacer"></div>
  </header>

  <div class="hero">
    <div>
      <p class="eyebrow">Team Dumbocracy</p>
      <h1 class="hero-title">Clout<span class="dot">.</span></h1>
      <p class="tagline">An Election Game</p>
      <div class="team">
        <div class="team-head"><span>Name</span><span>Roll number</span></div>
        <div class="member"><b>Pakki Sai Kaushik</b><span>AI23BTECH11017</span></div>
        <div class="member"><b>G Madhava Asrith Murthy</b><span>AI23BTECH11007</span></div>
        <div class="member"><b>Vuppula Hemanth Reddy</b><span>AI23BTECH11033</span></div>
        <div class="member"><b>Vishank Singh</b><span>AI23BTECH11032</span></div>
        <div class="member"><b>B U Deekshith Patel</b><span>AI23BTECH11003</span></div>
      </div>
    </div>
    <img class="net" src="assets/network-title.png" alt="A 1,000-voter Clout electorate from the web game, coloured by region">
  </div>
</section>
</body>
</html>
