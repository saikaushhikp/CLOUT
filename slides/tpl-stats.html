<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="manifest.js"></script>
<script src="deck.js"></script>
<title>Clout · Stats</title>
</head>
<body>
<section class="slide">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Clout</div>
    <div class="spacer"></div>
  </header>
  <div class="body">
    <p class="eyebrow">[Eyebrow]</p>
    <h1>[Headline: the result in words]</h1>
    <div class="stats mt-l" style="--cols: 3">
      <div class="panel stat"><span class="stat-label">[Metric A]</span><span class="stat-value">00<small>%</small></span><span class="stat-sub">[What it means / vs. baseline]</span></div>
      <div class="panel stat"><span class="stat-label">[Metric B]</span><span class="stat-value accent">0.00</span><span class="stat-sub">[What it means / vs. baseline]</span></div>
      <div class="panel stat"><span class="stat-label">[Metric C]</span><span class="stat-value">00<small>/100</small></span><span class="stat-sub">[What it means / vs. baseline]</span></div>
    </div>
    <div class="takeaway mt-auto"><span class="tag">Takeaway</span>[The single sentence the audience should remember.]</div>
  </div>
  <footer class="footer"><span data-deck="footer"></span><span class="pageno"></span></footer>
</section>
</body>
</html>
