<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="manifest.js"></script>
<script src="deck.js"></script>
<title>Clout · Table</title>
</head>
<body>
<section class="slide">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Clout</div>
    <div class="spacer"></div>
  </header>
  <div class="body">
    <p class="eyebrow">[Eyebrow]</p>
    <h1>[Headline: what the comparison shows]</h1>
    <div class="panel mt-l">
      <table class="data">
        <thead><tr><th>[Agent / arm]</th><th class="r">[Metric 1]</th><th class="r">[Metric 2]</th><th class="r">[Metric 3]</th><th>[Note]</th></tr></thead>
        <tbody>
          <tr class="hl"><td><b>[Best row]</b></td><td class="r">0.00</td><td class="r good">00%</td><td class="r">0.00</td><td class="ink2">[note]</td></tr>
          <tr><td>[Row]</td><td class="r">0.00</td><td class="r">00%</td><td class="r">0.00</td><td class="ink2">[note]</td></tr>
          <tr><td>[Row]</td><td class="r">0.00</td><td class="r">00%</td><td class="r">0.00</td><td class="ink2">[note]</td></tr>
          <tr><td>[Row]</td><td class="r">0.00</td><td class="r bad">0%</td><td class="r">0.00</td><td class="ink2">[note]</td></tr>
        </tbody>
      </table>
    </div>
    <p class="tiny muted mt-m">[Source: experiment id / n seeds / CI method]</p>
  </div>
  <footer class="footer"><span data-deck="footer"></span><span class="pageno"></span></footer>
</section>
</body>
</html>
