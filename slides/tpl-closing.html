<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="manifest.js"></script>
<script src="deck.js"></script>
<title>Clout · Closing</title>
<style>
  .close { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .close .hero-title { font-size: 168px; }
</style>
</head>
<body>
<section class="slide">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Clout</div>
    <div class="spacer"></div>
  </header>
  <div class="close">
    <p class="eyebrow">[Eyebrow]</p>
    <h1 class="hero-title">Thank you<span class="accent">.</span></h1>
    <p class="lead mt-m">[Closing line / question prompt]</p>
    <div class="row gap-m mt-l">
      <span class="btn primary">[Live demo link]</span>
      <span class="btn">[Repo / report link]</span>
    </div>
  </div>
  <footer class="footer"><span data-deck="footer"></span><span class="pageno"></span></footer>
</section>
</body>
</html>
