<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="manifest.js"></script>
<script src="deck.js"></script>
<title>Clout · Thank you</title>
<style>
  .close { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .close .hero-title { font-size: 200px; }
  .close .lead { margin-top: 36px; }
  .links { display: flex; gap: 20px; margin-top: 64px; align-items: center; flex-wrap: wrap; }
  .links .btn { font-family: var(--font-mono); font-weight: 500; font-size: 24px; }
  .team { margin-top: 28px; font-size: 22px; color: var(--ink-3); }
</style>
</head>
<body>
<section class="slide">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Clout <small data-deck="footer"></small></div>
    <div class="spacer"></div>
  </header>

  <div class="close">
    <p class="eyebrow">Team Dumbocracy</p>
    <h1 class="hero-title">Thank you<span class="accent">.</span></h1>
    <p class="lead">Questions?</p>
  </div>

  <footer class="footer"><span></span><span class="pageno"></span></footer>
</section>
</body>
</html>
