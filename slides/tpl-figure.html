<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="manifest.js"></script>
<script src="deck.js"></script>
<title>Clout · Figure</title>
</head>
<body>
<section class="slide">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Clout</div>
    <div class="spacer"></div>
  </header>
  <div class="body">
    <div class="split-60 grow">
      <figure class="panel">
        <div class="ph">[figure: img src="../reports/v3/…png"]</div>
        <figcaption><b>Figure [n].</b> [Caption: what is plotted, units, n seeds.]</figcaption>
      </figure>
      <div class="col">
        <p class="eyebrow" style="margin:0">[Eyebrow]</p>
        <h2>[Headline about the figure]</h2>
        <ul class="points small">
          <li>[Read the figure: first observation.]</li>
          <li>[Second observation.]</li>
          <li>[Why it matters.]</li>
        </ul>
        <div class="row gap-s mt-auto" style="flex-wrap:wrap">
          <span class="badge"><span class="swatch" style="background:var(--region-n)"></span>North</span>
          <span class="badge"><span class="swatch" style="background:var(--region-s)"></span>South</span>
          <span class="badge"><span class="swatch" style="background:var(--region-e)"></span>East</span>
          <span class="badge"><span class="swatch" style="background:var(--region-w)"></span>West</span>
        </div>
      </div>
    </div>
  </div>
  <footer class="footer"><span data-deck="footer"></span><span class="pageno"></span></footer>
</section>
</body>
</html>
