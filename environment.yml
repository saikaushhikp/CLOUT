# Conda environment for Clout.
#
#   conda env create -f environment.yml
#   conda activate mas
#
# Conda provides Python and Node.js (for the web game). The Python packages come from requirements.txt,
# which lists only the packages Clout imports, with compatible version ranges, so the environment solves
# without conflicts on Linux, macOS and Windows. It ends with an editable install of the Clout package.
#
# PyTorch: pip installs the default build for your platform. For a specific CUDA (or CPU-only) build, run
# the command from https://pytorch.org/get-started/locally/ inside the environment afterwards, e.g.
#   pip install --force-reinstall torch --index-url https://download.pytorch.org/whl/cu118
name: mas
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.14
  - nodejs>=20.9
  - pip
  - pip:
      - -r requirements.txt
