[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clout"
version = "2.0.0.dev0"
description = "Dumbocracy v2 - an election-campaign game on a GPU-simulated multi-agent electorate"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
analysis = ["matplotlib>=3.7", "scipy>=1.10"]
test = ["pytest>=8", "httpx>=0.27"]
llm = ["litellm>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA device (skipped when unavailable)",
    "slow: long-running statistical or scale test",
]

# The browser app has its own npm manifest under web/ (React 19 + Vite).
[tool.clout.frontend]
directory = "web"
node = ">=22.12.0"
npm = ">=10.0.0"
